name: Audit legacy round transaction

on:
  push:
    branches:
      - refactor/remove-legacy-round-transaction

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-round-transaction
          fetch-depth: 0
      - name: Audit legacy round references
        run: python3 .github/scripts/audit_legacy_round_transaction.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy_round_transaction_audit.txt
          git commit -m "chore: capture legacy round transaction audit"
          git push origin HEAD:refactor/remove-legacy-round-transaction
