name: Final round cut audit

on:
  push:
    branches:
      - refactor/remove-legacy-round-transaction

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-round-transaction
          fetch-depth: 0
      - name: Run final static audit
        id: audit
        shell: bash
        run: |
          set +e
          python3 .github/scripts/final_round_cut_audit.py > final_round_cut_audit_run.txt 2>&1
          status=$?
          cat final_round_cut_audit_run.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final_round_cut_audit.txt final_round_cut_audit_run.txt
          git commit -m "chore: capture final round-cut static audit"
          git push origin HEAD:refactor/remove-legacy-round-transaction
      - name: Fail gate when audit failed
        if: steps.audit.outputs.status != '0'
        run: exit 1
