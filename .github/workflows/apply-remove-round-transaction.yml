name: Apply round transaction removal

on:
  push:
    branches:
      - refactor/remove-legacy-round-transaction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-round-transaction
          fetch-depth: 0
      - name: Apply source cut
        id: patch
        shell: bash
        run: |
          set +e
          python3 .github/scripts/apply_remove_round_transaction.py > remove_round_transaction_run.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo >> remove_round_transaction_run.txt
            echo "===== residual transaction symbols after in-worktree patch =====" >> remove_round_transaction_run.txt
            grep -n -E 'BoundaryOrchestrator|ECrowdBoundaryTransactionState|TryPrepareRoundApply|BeginBoundaryTransaction|GetRoundWorkState' \
              Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.h \
              Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.cpp \
              Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimProcessors.cpp \
              >> remove_round_transaction_run.txt || true
          fi
          cat remove_round_transaction_run.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic
        if: steps.patch.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remove_round_transaction_run.txt
          git commit -m "chore: capture round transaction removal failure"
          git push origin HEAD:refactor/remove-legacy-round-transaction
      - name: Commit source cut
        if: steps.patch.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.h \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.cpp \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimProcessors.cpp
          if git diff --cached --quiet; then
            echo "No source changes produced"
            exit 1
          fi
          git commit -m "refactor: remove legacy round transaction scheduler"
          git push origin HEAD:refactor/remove-legacy-round-transaction
