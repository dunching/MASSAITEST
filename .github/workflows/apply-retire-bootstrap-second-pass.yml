name: Retire bootstrap second pass

on:
  push:
    branches:
      - refactor/remove-legacy-round-transaction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-round-transaction
          fetch-depth: 0
      - name: Apply source and test cleanup
        id: patch
        shell: bash
        run: |
          set +e
          python3 .github/scripts/apply_retire_bootstrap_second_pass.py > retire_bootstrap_second_pass_run.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo >> retire_bootstrap_second_pass_run.txt
            echo "===== residual retired symbols =====" >> retire_bootstrap_second_pass_run.txt
            grep -n -E 'PreparedTargetResource|PreparedMovementBoundary|PreparedParticleDiagnostic|ConsumeBoundary(Movement|Particle|Facing)|BoundaryOrchestrator|TryPrepareRoundApply|BeginBoundaryTransaction' \
              Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.h \
              Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.cpp \
              Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimProcessors.cpp \
              Source/MassAICrowdDemo/CrowdDemoCombatStateTests.cpp \
              >> retire_bootstrap_second_pass_run.txt || true
          fi
          cat retire_bootstrap_second_pass_run.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic
        if: steps.patch.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retire_bootstrap_second_pass_run.txt
          git commit -m "chore: capture bootstrap second-pass retirement failure"
          git push origin HEAD:refactor/remove-legacy-round-transaction
      - name: Commit final source cut
        if: steps.patch.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.h \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.cpp \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimProcessors.cpp \
            Source/MassAICrowdDemo/CrowdDemoCombatStateTests.cpp
          if git diff --cached --quiet; then
            echo "No source changes produced"
            exit 1
          fi
          git commit -m "refactor: retire bootstrap second-pass commit channels"
          git push origin HEAD:refactor/remove-legacy-round-transaction
