name: Fix PR12 bootstrap capture

on:
  push:
    branches:
      - refactor/remove-legacy-round-transaction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-round-transaction
          fetch-depth: 0
      - name: Patch exact lambda capture
        shell: python
        run: |
          from pathlib import Path
          path = Path('Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'const auto AddHashTask = [this, SnapshotHash]('
          new = 'const auto AddHashTask = [&BootstrapGraph, SnapshotHash]('
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old capture, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pr12-bootstrap-capture.yml
          git add Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.cpp
          git commit -m "fix: capture bootstrap graph in hash task"
          git push origin HEAD:refactor/remove-legacy-round-transaction
