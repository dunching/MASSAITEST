name: Apply production round cut

on:
  push:
    branches:
      - refactor/production-bypass-round-transaction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/production-bypass-round-transaction
          fetch-depth: 0
      - name: Apply source refactor
        id: patch
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimProcessors.cpp")
          text = path.read_text(encoding="utf-8-sig")
          marker = "MatchesCorrectionState("
          if text.count(marker) != 1:
              raise RuntimeError(f"{marker} expected definition-only count 1, found {text.count(marker)}")
          start = text.index("  bool MatchesCorrectionState(\n")
          end = text.index("  FVector MakeCenteredFormationOffset(\n", start)
          path.write_text(text[:start] + text[end:], encoding="utf-8")
          PY
          pre_status=$?
          if [ "$pre_status" -ne 0 ]; then
            echo "orphan rollback helper retirement failed" > production_round_cut_run.txt
            echo "status=$pre_status" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i 's/all_source = header + pipeline + processors + combat + local_tests/all_source = header + pipeline + processors/' .github/scripts/apply_production_round_cut.py
          python3 .github/scripts/apply_production_round_cut.py > production_round_cut_run.txt 2>&1
          status=$?
          cat production_round_cut_run.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit patch diagnostic
        if: steps.patch.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_round_cut_run.txt
          git commit -m "chore: capture production round cut patch failure"
          git push origin HEAD:refactor/production-bypass-round-transaction
      - name: Commit source refactor
        if: steps.patch.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.h \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.cpp \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimProcessors.cpp \
            Source/MassAICrowdDemo/CrowdDemoCombatStateTests.cpp \
            Source/MassAICrowdDemo/CrowdDemoLocalPredictiveInteractionTests.cpp
          if git diff --cached --quiet; then
            echo "No source changes produced"
            exit 1
          fi
          git commit -m "refactor: bypass round transaction in full worker production"
          git push origin HEAD:refactor/production-bypass-round-transaction
