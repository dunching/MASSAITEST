name: Apply shared flow owner refactor

on:
  push:
    branches:
      - refactor/shared-flow-runtime-owner

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-flow-runtime-owner
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 .github/scripts/apply_shared_flow_owner_refactor.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.h \
                  Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimPipelineSubsystem.cpp
          if git diff --cached --quiet; then
            echo "No source changes produced"
            exit 1
          fi
          git commit -m "refactor: move demo shared flow resource to runtime owner"
          git push origin HEAD:refactor/shared-flow-runtime-owner
