name: Audit round transaction cut

on:
  push:
    branches:
      - refactor/production-bypass-round-transaction

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/production-bypass-round-transaction
          fetch-depth: 0
      - name: Audit current references
        run: python3 .github/scripts/audit_round_transaction_cut.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add round_transaction_audit.txt
          if git diff --cached --quiet; then
            echo "No audit report produced"
            exit 1
          fi
          git commit -m "chore: capture round transaction cut audit"
          git push origin HEAD:refactor/production-bypass-round-transaction
