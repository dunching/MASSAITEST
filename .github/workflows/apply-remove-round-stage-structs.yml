name: Apply round stage struct removal

on:
  push:
    branches:
      - refactor/remove-legacy-round-transaction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-round-transaction
          fetch-depth: 0
      - name: Apply stage cleanup
        id: patch
        shell: bash
        run: |
          set +e
          python3 .github/scripts/apply_remove_round_stage_structs.py > remove_round_stage_structs_run.txt 2>&1
          status=$?
          cat remove_round_stage_structs_run.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic
        if: steps.patch.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remove_round_stage_structs_run.txt
          git commit -m "chore: capture stage-struct removal failure"
          git push origin HEAD:refactor/remove-legacy-round-transaction
      - name: Commit stage cleanup
        if: steps.patch.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimProcessors.h \
            Source/MassAICrowdDemo/Mass/CrowdDemoRoundSimProcessors.cpp
          if git diff --cached --quiet; then
            echo "No source changes produced"
            exit 1
          fi
          git commit -m "refactor: collapse round stages into processor-local helpers"
          git push origin HEAD:refactor/remove-legacy-round-transaction
