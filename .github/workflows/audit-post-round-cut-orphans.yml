name: Audit post round cut orphans

on:
  push:
    branches:
      - refactor/remove-legacy-round-transaction

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-round-transaction
          fetch-depth: 0
      - name: Audit source
        run: python3 .github/scripts/audit_post_round_cut_orphans.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_round_cut_orphans.txt
          git commit -m "chore: capture post-cut orphan audit"
          git push origin HEAD:refactor/remove-legacy-round-transaction
