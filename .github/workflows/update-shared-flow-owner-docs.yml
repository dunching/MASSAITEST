name: Update shared flow owner docs

on:
  push:
    branches:
      - refactor/shared-flow-runtime-owner

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-flow-runtime-owner
          fetch-depth: 0
      - name: Sync docs
        run: python3 .github/scripts/update_shared_flow_owner_docs.py
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/CurrentArchitecture.md Docs/FeatureChecklist.md \
                  Docs/LegacyCodeInventory.md Docs/SourceConsistencyAudit.md \
                  Docs/PhasePlan.md
          if git diff --cached --quiet; then
            echo "No documentation changes produced"
            exit 1
          fi
          git commit -m "docs: record shared flow runtime owner migration"
          git push origin HEAD:refactor/shared-flow-runtime-owner
